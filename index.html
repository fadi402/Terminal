<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Desk Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0e1116;
  font-family:Inter,sans-serif;
  color:#e6e6e6;
}

/* Container */
.wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:28px;
}

/* Clock */
.clock{
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1c222c, #0b0f15);
  border:1px solid rgba(255,255,255,.08);
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* Numbers */
.number{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  font-size:14px;
  opacity:.5;
}
.number span{
  transform:translateY(16px);
}

/* Hand */
.hand{
  position:absolute;
  width:4px;
  height:80px;
  background:#e6e6e6;
  top:50%;
  left:50%;
  transform-origin:bottom;
  transform:translate(-50%,-100%) rotate(0deg);
  border-radius:4px;
  cursor:grab;
}
.hand:active{cursor:grabbing}

/* Center pin */
.pin{
  position:absolute;
  width:10px;
  height:10px;
  background:#e6e6e6;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* Status */
.status{
  font-size:14px;
  opacity:.6;
  letter-spacing:.5px;
}

/* Unlock */
.unlocked .clock{
  box-shadow:0 0 60px rgba(120,255,200,.35);
}
.unlocked .status{
  opacity:1;
  color:#78ffc8;
}
.unlocked .panel{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

/* Panel */
.panel{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:22px 26px;
  width:280px;
  text-align:center;
  opacity:0;
  transform:translateY(20px);
  transition:.5s ease;
  pointer-events:none;
}
.panel h3{
  margin:0 0 6px;
  font-weight:600;
}
.panel p{
  margin:0;
  font-size:13px;
  opacity:.6;
}
</style>
</head>

<body>

<div class="wrapper" id="app">
  <div class="clock">
    <!-- numbers -->
    <div class="number" style="transform:rotate(0deg)"><span>12</span></div>
    <div class="number" style="transform:rotate(90deg)"><span>3</span></div>
    <div class="number" style="transform:rotate(180deg)"><span>6</span></div>
    <div class="number" style="transform:rotate(270deg)"><span>9</span></div>

    <!-- hand -->
    <div class="hand" id="hand"></div>
    <div class="pin"></div>
  </div>

  <div class="status" id="status">Set time to 10:00 to unlock</div>

  <div class="panel">
    <h3>Access Granted</h3>
    <p>Secure session initialized</p>
  </div>
</div>

<script>
const hand = document.getElementById("hand");
const app = document.getElementById("app");
const status = document.getElementById("status");

let dragging = false;
let angle = 0;
const unlockAngle = 300; // 10 o'clock

hand.addEventListener("mousedown",()=>dragging=true);
window.addEventListener("mouseup",()=>dragging=false);

window.addEventListener("mousemove",e=>{
  if(!dragging) return;

  const rect = hand.parentElement.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  if(angle < 0) angle += 360;

  hand.style.transform = `translate(-50%,-100%) rotate(${angle}deg)`;

  if(Math.abs(angle - unlockAngle) < 6){
    app.classList.add("unlocked");
    status.textContent = "Time confirmed";
  } else {
    app.classList.remove("unlocked");
    status.textContent = "Set time to 10:00 to unlock";
  }
});
</script>

</body>
</html>
