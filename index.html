<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Access Terminal</title>

<style>
*{
  box-sizing:border-box;
  font-family: "Courier New", monospace;
}
body{
  margin:0;
  background:#000;
  color:#00ff66;
  height:100vh;
  overflow:hidden;
}

/* TERMINAL */
#terminal{
  padding:30px;
  font-size:15px;
  line-height:1.6;
}
.line{
  opacity:0;
  animation: show 0.2s forwards;
}
@keyframes show{
  to{opacity:1;}
}

/* LOGIN */
#login{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-40%);
  width:320px;
  background:rgba(0,0,0,0.9);
  border:1px solid #00ff66;
  padding:25px;
  display:none;
}
#login h2{
  margin:0 0 15px;
  color:#00ff66;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  background:#000;
  border:1px solid #00ff66;
  color:#00ff66;
  outline:none;
}
button{
  width:100%;
  padding:12px;
  background:#00ff66;
  border:none;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#00cc55;
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="login">
  <h2>ACCESS GRANTED</h2>
  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">
  <button>LOGIN</button>
</div>

<script>
const terminal = document.getElementById("terminal");
const login = document.getElementById("login");

const lines = [
  "> booting kernel authority...",
  "> loading secure modules...",
  "> initializing encrypted channel...",
  "> verifying system integrity...",
  "> connection established.",
  "> access granted."
];

let index = 0;

function typeLine(){
  if(index >= lines.length){
    setTimeout(()=>{
      login.style.display = "block";
    },600);
    return;
  }

  const div = document.createElement("div");
  div.className = "line";
  terminal.appendChild(div);

  let text = lines[index];
  let i = 0;

  const typing = setInterval(()=>{
    div.textContent += text[i];
    i++;
    if(i >= text.length){
      clearInterval(typing);
      index++;
      setTimeout(typeLine, 400);
    }
  },40);
}

typeLine();
</script>

</body>
</html>
