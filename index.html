<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Inter,sans-serif;
  color:#fff;

  /* 🔁 Replace image URL with your Spider-Man background */
  background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.75)),
    url("https://images.unsplash.com/photo-1608889175112-4f4dffb0d4c1?auto=format&fit=crop&w=1920&q=80");
  background-size:cover;
  background-position:center;
}

/* Glass Card */
.login-box{
  width:320px;
  padding:28px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 30px 80px rgba(0,0,0,.6);
}

/* Heading */
.login-box h2{
  margin:0 0 6px;
  font-weight:600;
}
.login-box p{
  margin:0 0 18px;
  font-size:13px;
  opacity:.7;
}

/* Inputs */
.login-box input{
  width:100%;
  padding:11px 12px;
  margin-bottom:12px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(0,0,0,.45);
  color:#fff;
  font-size:14px;
}
.login-box input::placeholder{
  color:#bbb;
}

/* Button */
.login-box button{
  width:100%;
  padding:11px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:600;
  background:#ffffff;
  color:#000;
  transition:.25s;
}
.login-box button:hover{
  transform:translateY(-1px);
  opacity:.9;
}

/* Footer text */
.footer{
  margin-top:14px;
  font-size:12px;
  text-align:center;
  opacity:.6;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Welcome Back</h2>
  <p>Sign in to continue</p>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button>Sign In</button>

  <div class="footer">
    Private environment · Authorized access only
  </div>
</div>

</body>
</html>
