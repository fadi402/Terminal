<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Fadi Authority</title>

<!-- Professional Fonts -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;}
body{
  margin:0;
  background:#07090c;
  color:#00ffa6;
  height:100vh;
  font-family: "JetBrains Mono", monospace;
  overflow:hidden;
}

/* GRID BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#00ffa611 1px, transparent 1px),
    linear-gradient(90deg,#00ffa611 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

/* TERMINAL */
#terminal{
  padding:40px;
  font-size:15px;
  line-height:1.6;
  text-shadow:0 0 8px #00ffa644;
}
.cursor::after{
  content:"▮";
  animation:blink 1s infinite;
}
@keyframes blink{50%{opacity:0;}}

/* BRAND TOP */
#brand{
  position:fixed;
  top:15px;
  left:20px;
  font-family:Inter, sans-serif;
  font-weight:600;
  letter-spacing:1px;
  font-size:14px;
  color:#00ffa6;
  opacity:0.8;
}

/* LOGIN PANEL */
#login{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:360px;
  background:rgba(0,255,166,0.05);
  backdrop-filter: blur(20px);
  border:1px solid rgba(0,255,166,0.25);
  border-radius:18px;
  padding:28px;
  display:none;
  box-shadow:0 0 40px rgba(0,255,166,0.15);
  font-family:Inter,sans-serif;
}

#login h2{
  margin:0 0 20px;
  font-weight:600;
  text-align:center;
  letter-spacing:1px;
  color:#00ffa6;
}

input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,166,0.3);
  background:rgba(0,0,0,0.6);
  color:#00ffa6;
  outline:none;
  font-size:14px;
}

input::placeholder{color:#00ffa666;}

button{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#00ffa6;
  border:none;
  font-weight:700;
  color:#000;
  cursor:pointer;
  transition:0.2s;
}
button:hover{
  background:#00cc85;
}

/* FOOTER */
#footer{
  position:fixed;
  bottom:10px;
  right:15px;
  font-size:12px;
  opacity:0.4;
  font-family:Inter;
}
</style>
</head>

<body>

<div id="brand">KERNEL FADI AUTHORITY // SYSTEM INTERFACE</div>

<div id="terminal"></div>

<div id="login">
  <h2>AUTHORIZED ACCESS</h2>
  <input placeholder="Username">
  <input type="password" placeholder="Password">
  <button>ENTER SYSTEM</button>
</div>

<div id="footer">© Kernel Authority | Secure Interface</div>

<script>
const terminal = document.getElementById("terminal");
const login = document.getElementById("login");

const lines = [
  "Kernel Fadi Authority v2.4 booting...",
  "Loading cryptographic modules...",
  "Initializing AI core services...",
  "Checking system integrity...",
  "Encrypted channel established.",
  "User authentication required..."
];

let l = 0;
let c = 0;
let current = "";

function type(){
  if(l >= lines.length){
    setTimeout(()=>login.style.display="block",700);
    return;
  }

  current += lines[l][c] || "";
  terminal.innerHTML =
    terminal.innerHTML.split("<br>").slice(0,-1).join("<br>") +
    "<br><span class='cursor'>" + current + "</span>";

  c++;

  if(c > lines[l].length){
    terminal.innerHTML += "<br>";
    l++;
    c = 0;
    current = "";
    setTimeout(type,500);
  } else {
    setTimeout(type,35);
  }
}

terminal.innerHTML = "<span class='cursor'></span>";
type();
</script>

</body>
</html>
