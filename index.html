<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Authority — Private Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at top, #111827, #020617);
  font-family:Inter,sans-serif;
  color:#e6e6e6;
  overflow:hidden;
}

/* 🌍 Background Globe */
.globe{
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.05);
  box-shadow:0 0 80px rgba(120,160,255,.12);
  animation:spin 40s linear infinite;
}
.globe::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.08),
      rgba(255,255,255,.08) 1px,
      transparent 1px,
      transparent 22px
    );
}
@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* Main wrapper */
.wrapper{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:26px;
  z-index:2;
}

/* 🕰 CLOCK */
.clock{
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1e293b, #020617);
  border:1px solid rgba(255,255,255,.08);
  position:relative;
  box-shadow:0 0 40px rgba(120,160,255,.15);
  animation:breath 4s ease-in-out infinite;
}
@keyframes breath{
  0%,100%{box-shadow:0 0 35px rgba(120,160,255,.12)}
  50%{box-shadow:0 0 60px rgba(120,160,255,.25)}
}

.number{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  font-size:14px;
  opacity:.5;
}
.number span{transform:translateY(16px)}

.hand{
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:bottom;
  transform:translate(-50%,-100%) rotate(0deg);
  border-radius:4px;
  cursor:grab;
}
.hour{width:5px;height:70px;background:#e6e6e6}
.minute{width:3px;height:95px;background:#9fb3ff}

.pin{
  position:absolute;
  width:10px;
  height:10px;
  background:#fff;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* STATUS */
.status{
  font-size:13px;
  opacity:.65;
  letter-spacing:.4px;
}

/* 🔓 UNLOCK */
.unlocked .clock{
  box-shadow:0 0 90px rgba(255,210,140,.5);
}
.unlocked .panel{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

/* 🧊 Glass Panel */
.panel{
  width:320px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.18);
  border-radius:20px;
  padding:24px;
  text-align:center;
  opacity:0;
  transform:translateY(20px);
  transition:.7s ease;
  pointer-events:none;
}
.panel h3{
  margin:0 0 10px;
  font-weight:600;
}
.panel p{
  font-size:13px;
  opacity:.75;
}

/* Branding */
.brand{
  position:absolute;
  bottom:22px;
  font-size:12px;
  letter-spacing:2px;
  opacity:.45;
}
</style>
</head>

<body>

<div class="globe"></div>

<div class="wrapper unlocked" id="app">
  <div class="clock">
    <div class="number" style="transform:rotate(0deg)"><span>12</span></div>
    <div class="number" style="transform:rotate(90deg)"><span>3</span></div>
    <div class="number" style="transform:rotate(180deg)"><span>6</span></div>
    <div class="number" style="transform:rotate(270deg)"><span>9</span></div>
    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="pin"></div>
  </div>

  <div class="status">Private environment · Authorized access</div>

  <div class="panel">
    <h3>Secure Portfolio Space</h3>
    <p>
      This environment is privately maintained by<br>
      Kernel Authority.<br><br>
      Public access will be enabled soon.
    </p>
  </div>
</div>

<div class="brand">KERNEL AUTHORITY</div>

</body>
</html>
