<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Fadi Authority</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#05070a;
  color:#00ffb2;
  font-family:JetBrains Mono, monospace;
  height:100vh;
  overflow:hidden;
}

/* GRID */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#00ffb211 1px, transparent 1px),
    linear-gradient(90deg,#00ffb211 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
}

/* GLITCH BRAND */
#brand{
  position:fixed;
  top:15px;
  left:20px;
  font-family:Inter;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}
#brand::after{
  content:attr(data-text);
  position:absolute;
  left:2px;
  top:0;
  color:#00ffaa;
  opacity:.6;
  animation:glitch 2s infinite;
}
@keyframes glitch{
  0%{clip-path:inset(0 0 80% 0)}
  50%{clip-path:inset(40% 0 20% 0)}
  100%{clip-path:inset(0 0 0 0)}
}

/* BOOT */
#boot{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
#bar{
  width:300px;
  height:6px;
  border:1px solid #00ffb2;
}
#fill{
  height:100%;
  width:0%;
  background:#00ffb2;
}

/* TERMINAL */
#terminal{
  padding:40px;
  display:none;
  text-shadow:0 0 8px #00ffb255;
}
.cursor::after{content:"▮";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

/* LOGIN */
#login{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:360px;
  background:rgba(0,255,178,0.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(0,255,178,.3);
  border-radius:18px;
  padding:30px;
  display:none;
  font-family:Inter;
}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid rgba(0,255,178,.4);
  background:#000;
  color:#00ffb2;
}
button{
  background:#00ffb2;
  color:#000;
  font-weight:700;
  cursor:pointer;
}

/* DASHBOARD */
#dashboard{
  display:none;
  padding:60px;
  font-family:Inter;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.card{
  background:rgba(0,255,178,.05);
  border:1px solid rgba(0,255,178,.25);
  border-radius:16px;
  padding:20px;
}
.card h3{margin:0 0 10px;font-weight:600}
.small{opacity:.6;font-size:13px}
</style>
</head>

<body>

<div id="brand" data-text="Kernel Fadi Authority">Kernel Fadi Authority</div>

<!-- BOOT -->
<div id="boot">
  <div>Initializing Kernel Fadi Authority…</div>
  <div id="bar"><div id="fill"></div></div>
</div>

<!-- TERMINAL -->
<div id="terminal"></div>

<!-- LOGIN -->
<div id="login">
  <h3 style="text-align:center;margin:0">AUTHORIZED ACCESS</h3>
  <input placeholder="Username">
  <input type="password" placeholder="Password">
  <button onclick="enter()">ENTER SYSTEM</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>System Dashboard</h2>
  <p class="small">Kernel Fadi Authority • Secure Environment</p>
  <div class="cards">
    <div class="card"><h3>System Status</h3><p>Stable • Encrypted</p></div>
    <div class="card"><h3>Security Level</h3><p>Maximum</p></div>
    <div class="card"><h3>Active Modules</h3><p>12 Running</p></div>
    <div class="card"><h3>User Privilege</h3><p>Owner Access</p></div>
  </div>
</div>

<script>
/* BOOT */
let p=0;
const fill=document.getElementById("fill");
const boot=document.getElementById("boot");
const terminal=document.getElementById("terminal");
const login=document.getElementById("login");

const bootInt=setInterval(()=>{
  p+=5;
  fill.style.width=p+"%";
  if(p>=100){
    clearInterval(bootInt);
    boot.style.display="none";
    startTerminal();
  }
},80);

/* TERMINAL */
const lines=[
  "Kernel Fadi Authority v3.1",
  "Loading AI subsystems…",
  "Establishing encrypted channel…",
  "Verifying system integrity…",
  "All systems operational.",
  "Authentication required."
];
let l=0,c=0,cur="";

function startTerminal(){
  terminal.style.display="block";
  terminal.innerHTML="<span class='cursor'></span>";
  type();
}
function type(){
  if(l>=lines.length){
    setTimeout(()=>login.style.display="block",600);
    return;
  }
  cur+=lines[l][c]||"";
  terminal.innerHTML=terminal.innerHTML.split("<br>").slice(0,-1).join("<br>")+"<br><span class='cursor'>"+cur+"</span>";
  c++;
  if(c>lines[l].length){
    terminal.innerHTML+="<br>";
    l++;c=0;cur="";
    setTimeout(type,500);
  }else setTimeout(type,35);
}

/* LOGIN → DASHBOARD */
function enter(){
  login.style.display="none";
  terminal.style.display="none";
  document.getElementById("dashboard").style.display="block";
}
</script>

</body>
</html>
