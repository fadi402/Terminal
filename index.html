<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk Clock Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0d1117;
  font-family:Inter,sans-serif;
  color:#e6e6e6;
  transition:background 1s ease;
}

.wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:26px;
}

/* CLOCK */
.clock{
  width:260px;
  height:260px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #1b2230, #0a0f16);
  border:1px solid rgba(255,255,255,.08);
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  transition:box-shadow 1s ease;
}

.number{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  font-size:14px;
  opacity:.5;
}
.number span{transform:translateY(16px)}

.hand{
  position:absolute;
  top:50%;
  left:50%;
  transform-origin:bottom;
  transform:translate(-50%,-100%) rotate(0deg);
  border-radius:4px;
  cursor:grab;
}
.hand:active{cursor:grabbing}

.hour{
  width:5px;
  height:70px;
  background:#e6e6e6;
}
.minute{
  width:3px;
  height:95px;
  background:#9fb3ff;
}

.pin{
  position:absolute;
  width:10px;
  height:10px;
  background:#e6e6e6;
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* STATUS */
.status{
  font-size:13px;
  opacity:.6;
  letter-spacing:.4px;
  transition:.4s;
}

/* UNLOCK STATE */
.unlocked body{
  background:#0f141a;
}
.unlocked .clock{
  box-shadow:0 0 70px rgba(255,200,120,.35);
}
.unlocked .status{
  color:#ffd6a0;
  opacity:1;
}
.unlocked .panel{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

/* PANEL */
.panel{
  width:300px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:22px;
  text-align:center;
  opacity:0;
  transform:translateY(18px);
  transition:.6s ease;
  pointer-events:none;
}
.panel h3{
  margin:0 0 10px;
  font-weight:600;
}
.panel input{
  width:100%;
  padding:10px 12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  outline:none;
  background:#0d1117;
  color:#fff;
  font-size:14px;
}
.panel button{
  margin-top:14px;
  width:100%;
  padding:10px;
  border-radius:12px;
  border:none;
  background:#ffd6a0;
  color:#000;
  font-weight:600;
  cursor:pointer;
}
.panel p{
  margin-top:12px;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<div class="wrapper" id="app">
  <div class="clock">
    <div class="number" style="transform:rotate(0deg)"><span>12</span></div>
    <div class="number" style="transform:rotate(90deg)"><span>3</span></div>
    <div class="number" style="transform:rotate(180deg)"><span>6</span></div>
    <div class="number" style="transform:rotate(270deg)"><span>9</span></div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="pin"></div>
  </div>

  <div class="status" id="status">Set time to 10:30 to unlock</div>

  <div class="panel">
    <h3>Secure Access</h3>
    <input placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Continue</button>
    <p>Private environment · Limited access</p>
  </div>
</div>

<audio id="tick" src="https://assets.mixkit.co/sfx/preview/mixkit-clock-tick-1058.mp3"></audio>

<script>
const hour = document.getElementById("hour");
const minute = document.getElementById("minute");
const app = document.getElementById("app");
const status = document.getElementById("status");
const tick = document.getElementById("tick");

let activeHand = null;
let hAngle = 0;
let mAngle = 0;

const unlockH = 300; // 10
const unlockM = 180; // 30

function rotateHand(e){
  if(!activeHand) return;

  const clock = document.querySelector(".clock");
  const r = clock.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;

  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
  if(angle < 0) angle += 360;

  activeHand.style.transform =
    `translate(-50%,-100%) rotate(${angle}deg)`;

  tick.currentTime = 0;
  tick.play();

  if(activeHand === hour) hAngle = angle;
  if(activeHand === minute) mAngle = angle;

  if(Math.abs(hAngle-unlockH)<6 && Math.abs(mAngle-unlockM)<6){
    app.classList.add("unlocked");
    status.textContent = "Time verified";
  } else {
    app.classList.remove("unlocked");
    status.textContent = "Set time to 10:30 to unlock";
  }
}

hour.addEventListener("mousedown",()=>activeHand=hour);
minute.addEventListener("mousedown",()=>activeHand=minute);
window.addEventListener("mouseup",()=>activeHand=null);
window.addEventListener("mousemove",rotateHand);
</script>

</body>
</html>
