<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Inter,sans-serif;
  background:#000;
  color:#fff;
  overflow:hidden;
}

/* Spider-Man Images */
.spiderman{
  position:fixed;
  top:0;
  height:100vh;
  width:35vw;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  opacity:.25;
  pointer-events:none;
}

.left{
  left:0;
  background-image:url("https://i.imgur.com/8QfQKpH.png");
}
.right{
  right:0;
  background-image:url("https://i.imgur.com/0KFBHTB.png");
}

/* Login Card */
.login-box{
  position:relative;
  z-index:2;
  width:320px;
  padding:30px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 40px 90px rgba(0,0,0,.7);
}

/* Text */
.login-box h2{
  margin:0 0 6px;
  font-weight:600;
}
.login-box p{
  margin:0 0 18px;
  font-size:13px;
  opacity:.7;
}

/* Inputs */
.login-box input{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border-radius:12px;
  border:none;
  outline:none;
  background:#111;
  color:#fff;
  font-size:14px;
}

/* Button */
.login-box button{
  width:100%;
  padding:12px;
  border-radius:14px;
  border:none;
  background:#fff;
  color:#000;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}
.login-box button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

/* Footer */
.footer{
  margin-top:14px;
  text-align:center;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<!-- Spider-Man Decoration -->
<div class="spiderman left"></div>
<div class="spiderman right"></div>

<!-- Login -->
<div class="login-box">
  <h2>Login</h2>
  <p>Please enter your details</p>

  <input type="text" placeholder="Username">
  <input type="password" placeholder="Password">

  <button>Login</button>

  <div class="footer">
    © Your Website
  </div>
</div>

</body>
</html>
