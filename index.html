<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Authority Terminal</title>

<style>
*{
  box-sizing:border-box;
  font-family: Consolas, monospace;
}
body{
  margin:0;
  background:#000;
  color:#00ff66;
  height:100vh;
  overflow:hidden;
}
#terminal{
  padding:30px;
  font-size:15px;
  line-height:1.6;
}
.cursor::after{
  content:"▮";
  animation: blink 1s infinite;
}
@keyframes blink{
  50%{opacity:0;}
}
#login{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:320px;
  background:#000;
  border:1px solid #00ff66;
  padding:25px;
  display:none;
}
#login h2{
  margin:0 0 15px;
  text-align:center;
}
input{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  background:#000;
  border:1px solid #00ff66;
  color:#00ff66;
}
button{
  width:100%;
  padding:12px;
  background:#00ff66;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="terminal"></div>

<div id="login">
  <h2>ACCESS GRANTED</h2>
  <input placeholder="Username">
  <input type="password" placeholder="Password">
  <button>LOGIN</button>
</div>

<script>
const terminal = document.getElementById("terminal");
const login = document.getElementById("login");

const lines = [
  "Booting Kernel Authority v1.0",
  "Loading secure modules...",
  "Establishing encrypted channel...",
  "System integrity verified.",
  "Access granted."
];

let lineIndex = 0;
let charIndex = 0;
let currentLine = "";

function type(){
  if(lineIndex >= lines.length){
    setTimeout(()=>login.style.display="block",500);
    return;
  }

  currentLine += lines[lineIndex][charIndex] || "";
  terminal.innerHTML =
    terminal.innerHTML.split("<br>").slice(0,-1).join("<br>") +
    "<br><span class='cursor'>" + currentLine + "</span>";

  charIndex++;

  if(charIndex > lines[lineIndex].length){
    terminal.innerHTML += "<br>";
    lineIndex++;
    charIndex = 0;
    currentLine = "";
    setTimeout(type,400);
  } else {
    setTimeout(type,40);
  }
}

terminal.innerHTML = "<span class='cursor'></span>";
type();
</script>

</body>
</html>
