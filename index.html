<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kernel Authority</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#06080c;
  color:#9fffe0;
  font-family:Inter, sans-serif;
  height:100vh;
  overflow:hidden;
}

/* Subtle grid */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    linear-gradient(#9fffe008 1px, transparent 1px),
    linear-gradient(90deg,#9fffe008 1px, transparent 1px);
  background-size:48px 48px;
  pointer-events:none;
}

/* Brand */
#brand{
  position:fixed;
  top:16px;
  left:24px;
  font-weight:600;
  letter-spacing:1px;
  opacity:.85;
}

/* Boot */
#boot{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-family:JetBrains Mono;
}
#bar{width:320px;height:5px;border:1px solid #9fffe0}
#fill{height:100%;width:0;background:#9fffe0}

/* Terminal */
#terminal{
  display:none;
  padding:48px;
  font-family:JetBrains Mono;
  font-size:14px;
  opacity:.9;
}
.cursor::after{content:"▮";animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}

/* Login */
#login{
  display:none;
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:360px;
  background:rgba(159,255,224,.06);
  backdrop-filter:blur(18px);
  border:1px solid rgba(159,255,224,.25);
  border-radius:18px;
  padding:28px;
}
#login h3{margin:0 0 18px;text-align:center}
input,button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid rgba(159,255,224,.35);
  background:#000;
  color:#9fffe0;
}
button{
  background:#9fffe0;
  color:#000;
  font-weight:700;
  cursor:pointer;
}

/* Dashboard */
#dashboard{
  display:none;
  padding:70px 50px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}
.card{
  background:rgba(159,255,224,.05);
  border:1px solid rgba(159,255,224,.2);
  border-radius:16px;
  padding:20px;
}
.card h4{margin:0 0 8px}
.small{opacity:.6;font-size:13px}

/* Map dots */
.map{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:6px;
}
.dot{
  height:6px;width:6px;
  background:#9fffe0;
  opacity:.5;
  border-radius:50%;
}

/* Footer */
#foot{
  position:fixed;
  bottom:12px;
  right:18px;
  font-size:12px;
  opacity:.35;
}
</style>
</head>

<body>

<div id="brand">Kernel Authority</div>

<!-- BOOT -->
<div id="boot">
  <div>Initializing secure kernel…</div>
  <div id="bar"><div id="fill"></div></div>
</div>

<!-- TERMINAL -->
<div id="terminal"></div>

<!-- LOGIN -->
<div id="login">
  <h3>Secure Access</h3>
  <input placeholder="Username">
  <input type="password" placeholder="Password">
  <button onclick="enter()">Continue</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <h2>System Overview</h2>
  <p class="small">Enterprise secure environment</p>

  <div class="cards">
    <div class="card">
      <h4>System Health</h4>
      <p>Operational • Stable</p>
    </div>

    <div class="card">
      <h4>AI Monitor</h4>
      <p>Analysis running<br><span class="small">No anomalies detected</span></p>
    </div>

    <div class="card">
      <h4>Activity Map</h4>
      <div class="map">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>

    <div class="card">
      <h4>Access Level</h4>
      <p>Owner Privilege</p>
    </div>
  </div>
</div>

<div id="foot">Kernel Authority ©</div>

<script>
/* Boot */
let p=0;
const fill=document.getElementById("fill");
const boot=document.getElementById("boot");
const terminal=document.getElementById("terminal");
const login=document.getElementById("login");

const bootInt=setInterval(()=>{
  p+=4; fill.style.width=p+"%";
  if(p>=100){
    clearInterval(bootInt);
    boot.style.display="none";
    startTerminal();
  }
},90);

/* Terminal */
const lines=[
  "Kernel Authority v4.0",
  "Loading security modules…",
  "Initializing intelligence layer…",
  "Verifying integrity…",
  "Environment secure.",
  "Authentication required."
];
let l=0,c=0,cur="";

function startTerminal(){
  terminal.style.display="block";
  terminal.innerHTML="<span class='cursor'></span>";
  type();
}
function type(){
  if(l>=lines.length){
    setTimeout(()=>login.style.display="block",600);
    return;
  }
  cur+=lines[l][c]||"";
  terminal.innerHTML=terminal.innerHTML.split("<br>").slice(0,-1).join("<br>")+"<br><span class='cursor'>"+cur+"</span>";
  c++;
  if(c>lines[l].length){
    terminal.innerHTML+="<br>";
    l++;c=0;cur="";
    setTimeout(type,450);
  } else setTimeout(type,32);
}

/* Login */
function enter(){
  login.style.display="none";
  terminal.style.display="none";
  document.getElementById("dashboard").style.display="block";
}
</script>

</body>
</html>
